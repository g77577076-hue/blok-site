<style>

.bell{position:relative;width:44px;height:44px;border-radius:12px;border:1px solid var(--ln);background:var(--pn);display:grid;place-items:center;cursor:pointer}.bell svg{width:20px;height:20px;stroke:var(--iv);fill:none;stroke-width:1.8}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--pn);border:1px solid var(--ln);border-radius:18px;padding:16px 18px;position:relative;overflow:hidden}
.kpi:before{content:"";position:absolute;inset-inline-end:-30px;top:-30px;width:90px;height:90px;border-radius:50%;background:rgba(201,138,91,.1)}
.kpi span{display:block;font-size:12px;color:var(--mu);font-weight:700}.kpi b{display:block;font-size:34px;font-weight:900;line-height:1.15;margin-top:4px}.kpi.w b{color:var(--wr)}.kpi.e b{color:var(--er)}.kpi small{font-size:13px;color:var(--mu);font-weight:600}

.chart{display:flex;gap:10px;align-items:flex-end;height:120px}.chart div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;font-size:11px;color:var(--mu)}.chart i{display:block;width:100%;max-width:46px;border-radius:8px 8px 3px 3px;background:linear-gradient(var(--cu),#8c5a36);min-height:3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:900px){.grid2{grid-template-columns:1fr}}

.od{background:var(--pn);border:1px solid var(--ln);border-radius:16px;padding:16px;margin-bottom:12px;display:grid;gap:8px}
.od .h{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.od .id{font-weight:900;color:var(--cu);letter-spacing:.05em}.od .dt{color:var(--mu);font-size:12px}
.pill{border-radius:99px;padding:3px 12px;font-size:12px;font-weight:800;background:var(--pn2)}.pill.new{background:rgba(224,178,90,.15);color:var(--wr)}.pill.confirmed,.pill.shipped{background:rgba(111,191,138,.14);color:var(--ok)}.pill.delivered{background:rgba(111,191,138,.3);color:#b9efcb}.pill.cancelled{background:rgba(232,128,111,.14);color:var(--er)}

.mo{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:50;display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:16px}

.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}.fg .w2{grid-column:1/-1}@media(max-width:560px){.fg{grid-template-columns:1fr}}

.sw{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px;cursor:pointer}.sw input{accent-color:var(--cu);width:18px;height:18px}
/* offers */
.of{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:14px;border:1px solid var(--ln);border-radius:14px;margin-bottom:10px;background:var(--pn)}.of .pc2{font-size:30px;font-weight:900;color:var(--cu);min-width:80px}.of .inf{flex:1;min-width:160px}.of .inf b{display:block}.of .inf small{color:var(--mu)}
/* preview */
.pv{border:1px solid var(--ln);border-radius:18px;overflow:hidden;background:#000;height:72vh;display:grid;place-items:stretch}.pv iframe{width:100%;height:100%;border:0}
.pvw{max-width:420px;margin-inline:auto}
.toast{position:fixed;bottom:84px;inset-inline:0;margin:auto;width:max-content;max-width:90vw;background:var(--cu);color:#14171A;padding:11px 20px;border-radius:12px;font-weight:800;z-index:99;transform:translateY(30px);opacity:0;transition:.25s;pointer-events:none}.toast.on{transform:none;opacity:1}
.empty{color:var(--mu);text-align:center;padding:30px}
.muted{color:var(--mu);font-size:13px}
@media(max-width:860px){#app{display:block}aside.sb{position:fixed;inset:auto 0 0 0;height:auto;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:40;border-inline-end:0;border-top:1px solid var(--ln);gap:2px;background:rgba(16,19,21,.95)}
 .sb .lg,.sb .bt{display:none}.nv{flex-direction:column;gap:3px;font-size:10px;padding:7px 2px;text-align:center;justify-content:center;flex:1;border-radius:10px}.nv .bdg{position:absolute;top:2px;inset-inline-start:50%;margin:0;font-size:9px;padding:0 5px}

function compress(file,max,q){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/webp',q))};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}
function thumbOf(u){return new Promise(res=>{if(!/^data:/.test(u))return res(u);const im=new Image();im.onload=()=>{const k=Math.min(1,520/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/webp',.72))};im.onerror=()=>res(u);im.src=u})}

qi.addEventListener('input',run);
qr.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.goor){go('or');return}if(b.dataset.cpo){const o=OR.find(x=>x.id===b.dataset.cpo);if(!o)return;let ls=[];try{ls=JSON.parse(o.cart||'[]')}catch(e){}const lines=ls.length?ls.map(l=>{const p=PR[l.code];return '- '+(p?p.name:l.code)+' ('+l.code+')'+(l.size?' · مقاس '+l.size:'')+' × '+(+l.qty||1)}).join('\n'):String(o.items||'');const t='طلب '+o.id+'\nالعميل: '+(o.name||'')+'\nالموبايل: '+(o.phone||'')+'\nالمحافظة: '+(o.gov||'')+'\nالعنوان: '+(o.address||'')+'\nالمنتجات:\n'+lines+'\nإجمالي المنتجات: '+fmt(o.subtotal)+' ج.م';try{await navigator.clipboard.writeText(t);toast('اتنسخ بيانات الطلب')}catch(x){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('اتنسخ بيانات الطلب')}catch(y){toast('تعذر النسخ')}ta.remove()}return}

if(b.dataset.cp){const p=PR[b.dataset.cp];if(!p)return;const t=msg(p);try{await navigator.clipboard.writeText(t);toast('اتنسخ. ابعته للعميل')}catch(x){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('اتنسخ. ابعته للعميل')}catch(y){toast('تعذر النسخ')}ta.remove()}}
if(b.dataset.ed){go('pr');const eb=document.querySelector('[data-e="'+CSS.escape(b.dataset.ed)+'"]');if(eb)eb.click()}});

/* order-photo lightbox */
const LBC={};let lbTok=0,lbEl=null,lbI=[],lbX=0,sc=1,tx=0,ty=0;
function lbApply(){const im=lbEl.querySelector('img');im.style.transform='translate('+tx+'px,'+ty+'px) scale('+sc+')'}
function lbShow(){const im=lbEl.querySelector('img');sc=1;tx=0;ty=0;lbApply();im.src=IM(lbI[lbX]||'');lbEl.querySelector('.ct').textContent=lbI.length>1?(lbX+1)+' / '+lbI.length:'';lbEl.querySelector('.pv').style.display=lbEl.querySelector('.nx').style.display=lbI.length>1?'flex':'none'}
function lbGo(d){if(lbI.length<2)return;lbX=(lbX+d+lbI.length)%lbI.length;lbShow()}
function lbClose(){if(lbEl)lbEl.classList.remove('on');document.body.style.overflow=''}
function lbBuild(){if(lbEl)return;lbEl=document.createElement('div');lbEl.id='lb';lbEl.innerHTML='<div class="st"><img alt=""></div><div class="ld">جاري التحميل...</div><button class="x" type="button" aria-label="إغلاق">✕</button><button class="pv" type="button" aria-label="السابق">‹</button><button class="nx" type="button" aria-label="التالي">›</button><div class="ct"></div>';document.body.appendChild(lbEl);
lbEl.querySelector('.x').onclick=lbClose;lbEl.querySelector('.pv').onclick=()=>lbGo(-1);lbEl.querySelector('.nx').onclick=()=>lbGo(1);
const st=lbEl.querySelector('.st');let m=null,t0=0,lastTap=0;const dist=e=>Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
st.addEventListener('touchstart',e=>{if(e.touches.length===2){m={k:'p',d:dist(e),s:sc}}else if(e.touches.length===1){const t=e.touches[0];m={k:'o',x:t.clientX,y:t.clientY,tx,ty,moved:0};const n=Date.now();if(n-lastTap<300){sc=sc>1?1:2.5;if(sc===1){tx=0;ty=0}lbApply();m=null}lastTap=n}},{passive:true});
st.addEventListener('touchmove',e=>{if(!m)return;if(m.k==='p'&&e.touches.length===2){sc=Math.min(5,Math.max(1,m.s*dist(e)/m.d));if(sc===1){tx=0;ty=0}lbApply()}else if(m.k==='o'&&e.touches.length===1){const t=e.touches[0],dx=t.clientX-m.x,dy=t.clientY-m.y;if(Math.abs(dx)+Math.abs(dy)>6)m.moved=1;if(sc>1){tx=m.tx+dx;ty=m.ty+dy;lbApply()}}},{passive:true});
st.addEventListener('touchend',e=>{if(m&&m.k==='o'&&e.changedTouches.length){const t=e.changedTouches[0],dx=t.clientX-m.x,dy=t.clientY-m.y;if(sc===1&&Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.3)lbGo(dx<0?1:-1);else if(sc===1&&!m.moved&&e.target===st)lbClose()}if(e.touches.length===0)m=null;else if(e.touches.length===1&&m&&m.k==='p'){const t=e.touches[0];m={k:'o',x:t.clientX,y:t.clientY,tx,ty,moved:1}}},{passive:true});
st.addEventListener('click',e=>{if(e.target===st&&sc===1)lbClose()});
st.addEventListener('wheel',e=>{e.preventDefault();sc=Math.min(5,Math.max(1,sc*(e.deltaY<0?1.15:.87)));if(sc===1){tx=0;ty=0}lbApply()},{passive:false});
document.addEventListener('keydown',e=>{if(!lbEl.classList.contains('on'))return;if(e.key==='Escape')lbClose();if(e.key==='ArrowLeft')lbGo(1);if(e.key==='ArrowRight')lbGo(-1)})}
async function lbOpen(code,first){lbBuild();const tok=++lbTok;const p=PR[code];lbI=[first||(p&&p.thumb)||''];lbX=0;lbEl.classList.add('on','busy');document.body.style.overflow='hidden';lbShow();
let imgs=LBC[code];if(!imgs){try{const sn=await getDoc(doc(db,'pimgs',code));imgs=sn.exists()?JSON.parse(sn.data().data):null}catch(e){imgs=null}if(imgs&&imgs.length)LBC[code]=imgs}
if(tok!==lbTok)return;lbEl.classList.remove('busy');if(imgs&&imgs.length&&lbEl.classList.contains('on')){const cur=lbI[0];lbI=imgs.slice();lbX=Math.max(0,lbI.indexOf(first));if(lbX<0)lbX=0;lbShow()}}
qr.addEventListener('click',e=>{const im=e.target.closest('img[data-lb]');if(!im)return;lbOpen(im.getAttribute('data-lb'),im.getAttribute('src'))});
})();
