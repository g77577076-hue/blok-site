<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>BLOK Admin</title>
<style>*{box-sizing:border-box}body{margin:0;background:#14171A;color:#F3EDE3;font-family:Cairo,system-ui,sans-serif;padding:20px}h1{color:#C98A5B;margin:0 0 4px}.b{background:#C98A5B;color:#14171A;border:0;border-radius:10px;padding:10px 18px;font:700 15px Cairo,sans-serif;cursor:pointer}.g{background:none;border:1px solid #C98A5B;color:#C98A5B}.o{background:#1d2227;border:1px solid #2c333a;border-radius:14px;padding:14px;margin:10px 0}.o b{color:#C98A5B}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}select{background:#14171A;color:#F3EDE3;border:1px solid #444;border-radius:8px;padding:6px}.k{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.k div{background:#1d2227;border-radius:12px;padding:10px 16px}.k span{display:block;font-size:22px;color:#C98A5B;font-weight:800}pre{white-space:pre-wrap;margin:6px 0;font-family:inherit}#m{color:#e88}</style></head><body>
<h1>BLOK · لوحة الإدارة</h1><div id="m"></div><div id="in"><p>دخول المالك فقط.</p><button class="b" id="li">دخول بجوجل</button></div><div id="app" hidden><div class="row"><span id="who"></span><button class="b g" id="lo">خروج</button></div><div class="k" id="k"></div><div id="ol"></div></div>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import{getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import{getFirestore,collection,query,orderBy,limit,getDocs,doc,updateDoc}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
const OWNER='g77577076@gmail.com';
const app=initializeApp({apiKey:'AIzaSyDKY_vrdZnOe6nFjyBxYyavSzT1S5BMaIQ',authDomain:'blok-store.firebaseapp.com',projectId:'blok-store'});
const au=getAuth(app),db=getFirestore(app),$=s=>document.querySelector(s),m=$('#m');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
$('#li').onclick=()=>signInWithPopup(au,new GoogleAuthProvider()).catch(e=>m.textContent='تعذر الدخول: '+e.code);
$('#lo').onclick=()=>signOut(au);
onAuthStateChanged(au,u=>{m.textContent='';if(!u){$('#in').hidden=false;$('#app').hidden=true;return}
 if(u.email!==OWNER||!u.emailVerified){m.textContent='هذا الحساب غير مصرح له.';signOut(au);return}
 $('#in').hidden=true;$('#app').hidden=false;$('#who').textContent=u.email;load()});
const ST=['new','confirmed','shipped','delivered','cancelled'],LB={new:'جديد',confirmed:'اتأكد',shipped:'اتشحن',delivered:'اتسلم',cancelled:'ملغي'};
async function load(){try{const s=await getDocs(query(collection(db,'orders'),orderBy('createdAt','desc'),limit(200)));const a=[];s.forEach(d=>a.push(d.data()));
 const sum=a.reduce((t,o)=>t+(o.subtotal||0),0),dep=a.reduce((t,o)=>t+(o.deposit||0),0);
 $('#k').innerHTML='<div>الطلبات<span>'+a.length+'</span></div><div>جديد<span>'+a.filter(o=>o.status==='new').length+'</span></div><div>إجمالي<span>'+sum+'</span></div><div>عربون<span>'+dep+'</span></div>';
 $('#ol').innerHTML=a.length?a.map(o=>'<div class="o"><b dir="ltr">'+esc(o.id)+'</b> · '+esc(o.createdAt&&o.createdAt.toDate?o.createdAt.toDate().toLocaleString('ar-EG'):'')+'<pre>'+esc(o.name)+' · '+esc(o.phone)+'\n'+esc(o.gov)+' · '+esc(o.address)+'\n'+esc(o.items)+(o.notes?'\nملاحظات: '+esc(o.notes):'')+'</pre><div>الإجمالي '+o.subtotal+' · الدفع عند الاستلام'+'</div><div class="row"><select data-id="'+esc(o.id)+'">'+ST.map(x=>'<option value="'+x+'"'+(x===o.status?' selected':'')+'>'+LB[x]+'</option>').join('')+'</select></div></div>').join(''):'<p>مفيش طلبات لسه.</p>';
 document.querySelectorAll('select[data-id]').forEach(sel=>sel.onchange=()=>updateDoc(doc(db,'orders',sel.dataset.id),{status:sel.value}).then(()=>m.textContent='').catch(e=>m.textContent='فشل التحديث: '+e.code));
}catch(e){m.textContent='خطأ: '+e.code}}
</script></body></html>
