 <label class="f">السعر (ج.م)<input id="f-p" type="number" min="1" value="${esc(p.price)}"></label><label class="f">سعر بعد الخصم (اختياري)<input id="f-sp" type="number" min="0" value="${esc(p.salePrice||'')}"></label>
 <label class="f">شارة (مثال DROP 02)<input id="f-b" type="text" value="${esc(p.badge||'')}"></label><label class="f">حد التنبيه (لما يوصل لـ)<input id="f-l" type="number" min="0" value="${esc(p.lowAt||3)}"></label>
 <label class="f w2">الوصف<textarea id="f-d">${esc(p.desc||'')}</textarea></label>
 <label class="f w2">المقاسات (بفاصلة، سيبها فاضية لو مفيش مقاسات)<input id="f-sz" type="text" dir="ltr" value="${esc(p.sizes.join(','))}"></label></div>
 <label class="sw" style="margin-bottom:8px"><input type="checkbox" id="f-t" ${p.track?'checked':''}> تتبّع المخزون (القطعة بتخلص لما الكمية توصل صفر)</label><div id="sk" class="sizes"></div>
 <div style="margin-top:14px"><b>الصور</b> <span class="muted">(أول صورة هي الرئيسية، بتتضغط تلقائيا)</span><div id="ims" class="ims"></div><div class="row"><label class="btn g s" style="cursor:pointer">رفع صور<input type="file" id="f-f" accept="image/*" multiple hidden></label><input id="f-u" type="text" dir="ltr" placeholder="أو لينك صورة https://..." style="flex:1;min-width:160px"><button class="btn g s" id="f-ua">إضافة اللينك</button></div></div>
 <div class="row" style="margin-top:12px"><button class="btn g s" id="f-ai" type="button">✨ عبّي البيانات من الصور</button><span id="f-am" class="muted"></span></div>
 <label class="sw" style="margin-top:14px"><input type="checkbox" id="f-a" ${p.active?'checked':''}> ظاهر في المتجر</label>
 <div class="row" style="margin-top:18px"><button class="btn" id="f-s">حفظ</button><button class="btn g" id="f-x">إلغاء</button><span id="f-m" class="muted"></span></div></div>`;
 draw();$('#f-sz').oninput=draw;
 if(isN)$('#f-cat').onchange=e=>{$('#f-sz').value=SZ[e.target.value]||SZD;draw()};
 $('#f-f').onchange=async e=>{$('#f-m').textContent='بتضغط الصور...';for(const f of e.target.files){if(imgs.length>=5){toast('أقصى 5 صور');break}try{imgs.push(await compress(f,900,.78))}catch(x){toast('صورة مش مقروءة')}}$('#f-m').textContent='';draw();if(isN&&!$('#f-n').value.trim()&&imgs.length)runAI(false)};

 const fill=(r,force)=>{const set=(id,v)=>{const e=$(id);if(e&&v&&(force||!e.value.trim()))e.value=v};set('#f-n',r.name);if(r.category&&CATS.includes(r.category)&&(force||isN)){$('#f-cat').value=r.category;if(isN&&!$('#f-sz').dataset.t){}}set('#f-d',r.description);if(Array.isArray(r.sizes)&&r.sizes.length&&(force||isN)){$('#f-sz').value=r.sizes.join(',');draw()}set('#f-b',(r.badge||'').toString().slice(0,20))};
 const runAI=async(force)=>{const b=$('#f-ai'),m=$('#f-am');b.disabled=true;m.textContent='بحلل الصور...';try{const r=await aiAnalyze(imgs);fill(r,force);m.textContent='اتملى. راجع البيانات قبل الحفظ'+(r.confidence&&r.confidence<.6?' (مش متأكد أوي، راجع كويس)':'');}catch(e){m.textContent=e.message==='NOKEY'?'ضيف مفتاح Gemini من تبويب نظرة عامة':e.message==='NOIMG'?'ارفع صورة من الجهاز الأول (مش لينك)':'فشل التحليل: '+String(e.message).slice(0,80)}b.disabled=false};
 $('#f-ai').onclick=()=>{if($('#f-n').value.trim()&&!confirm('ده هيستبدل الاسم والوصف الحاليين. تكمل؟'))return;runAI(true)};
 $('#f-ua').onclick=()=>{const u=$('#f-u').value.trim();if(/^https:\/\//.test(u)&&imgs.length<5){imgs.push(u);$('#f-u').value='';draw()}else toast('لينك https صحيح بس')};
 $('#f-x').onclick=close;mo.onclick=e=>{if(e.target===mo)close()};
 $('#f-s').onclick=async()=>{const c=$('#f-c').value.trim().toUpperCase(),n=$('#f-n').value.trim(),pr=+$('#f-p').value,sp=+$('#f-sp').value||0;
  if(!/^[A-Z0-9-]{3,20}$/.test(c))return toast('الكود حروف إنجليزي وأرقام وشرطة بس');if(n.length<2)return toast('اكتب الاسم');if(!(pr>0))return toast('اكتب السعر');if(sp&&sp>=pr)return toast('سعر الخصم لازم يكون أقل من السعر');if(!imgs.length)return toast('ضيف صورة واحدة على الأقل');
  if(isN&&PR[c]&&!confirm('الكود ده موجود. تستبدله؟'))return;
  const sizes=$('#f-sz').value.split(',').map(x=>x.trim()).filter(Boolean),stock={};$$('#sk input').forEach(i=>stock[i.dataset.k]=Math.max(0,Math.floor(+i.value||0)));
  $('#f-s').disabled=true;$('#f-m').textContent='بيحفظ...';
  try{const th=await thumbOf(imgs[0]),size=JSON.stringify(imgs).length;if(size>900000)throw new Error('الصور كبيرة، شيل صورة أو استخدم لينك');
   const data=JSON.stringify({name:n,price:pr,salePrice:sp||0,cat:$('#f-cat').value,badge:$('#f-b').value.trim(),desc:$('#f-d').value.trim(),sizes,lowAt:Math.max(0,Math.floor(+$('#f-l').value||0)),ord:p.ord||0});
   await setDoc(doc(db,'pimgs',c),{data:JSON.stringify(imgs)});
   await setDoc(doc(db,'products',c),{code:c,data,stock,track:$('#f-t').checked,active:$('#f-a').checked,thumb:th,updatedAt:serverTimestamp()});
   await loadP();close();toast('اتحفظ ✅');render()}catch(e){$('#f-s').disabled=false;$('#f-m').textContent='';toast('فشل: '+(e.message||e.code))}}}
/* inventory */
function rIv(){const l=Object.values(PR).sort((a,b)=>(a.ord||0)-(b.ord||0));$('#v-iv').innerHTML=`<div class="card"><h3>المخزون لكل مقاس</h3>${l.map(p=>{const keys=p.sizes&&p.sizes.length?p.sizes:['ONE'],t=tot(p);return`<div class="iv"><img src="${esc(IM(p.thumb))}" alt=""><div><div class="cd">${esc(p.code)}</div><div class="nm">${esc(p.name)}</div><div class="muted">${p.track?'الإجمالي '+t+(t<=0?' · خلص':t<=(+p.lowAt||3)?' · قرّب يخلص':''):'المخزون مش متتبَّع (القطعة دايما متاحة)'}</div><div class="sizes" data-p="${esc(p.code)}">${keys.map(k=>{const v=+p.stock[k]||0;return`<label class="sq ${p.track&&v<=0?'z':''}">${k==='ONE'?'الكمية':esc(k)}<input type="number" min="0" data-k="${esc(k)}" value="${v}" ${p.track?'':'disabled'}></label>`}).join('')}</div></div><div class="ac row"><label class="sw"><input type="checkbox" data-tr="${esc(p.code)}" ${p.track?'checked':''}> تتبّع</label><button class="btn s" data-sv="${esc(p.code)}" ${p.track?'':'disabled'}>حفظ</button></div></div>`}).join('')||'<div class="empty">ضيف منتجات الأول.</div>'}</div><p class="muted">المخزون بيتخصم تلقائي لما تغيّر حالة الطلب لـ "اتأكد"، وبيرجع لو الطلب اتلغى.</p>`;
 $$('[data-sv]').forEach(b=>b.onclick=async()=>{const c=b.dataset.sv,st={};$$('[data-p="'+c+'"] input').forEach(i=>st[i.dataset.k]=Math.max(0,Math.floor(+i.value||0)));try{await updateDoc(doc(db,'products',c),{stock:st});PR[c].stock=st;toast('اتحفظ ✅');render()}catch(e){toast('فشل: '+e.code)}});
 $$('[data-tr]').forEach(c=>c.onchange=async()=>{try{await updateDoc(doc(db,'products',c.dataset.tr),{track:c.checked});PR[c.dataset.tr].track=c.checked;render()}catch(e){toast('فشل: '+e.code)}})}
/* offers */
function rOf(){const tg=()=>{const sc=$('#o-s').value;$('#o-t').innerHTML=sc==='cat'?CATS.map(c=>`<option>${c}</option>`).join(''):sc==='code'?Object.values(PR).map(p=>`<option value="${esc(p.code)}">${esc(p.code)} · ${esc(p.name)}</option>`).join(''):'<option value="">كل المنتجات</option>';$('#o-t').disabled=sc==='all'};
 $('#v-of').innerHTML=`<div class="card"><h3>عرض جديد</h3><div class="fg"><label class="f">اسم العرض<input id="o-n" type="text" placeholder="مثال: عرض الجمعة"></label><label class="f">نسبة الخصم %<input id="o-p" type="number" min="1" max="90" value="10"></label><label class="f">ينطبق على<select id="o-s" style="width:100%"><option value="all">كل المنتجات</option><option value="cat">قسم</option><option value="code">قطعة واحدة</option></select></label><label class="f">الاختيار<select id="o-t" style="width:100%"></select></label><label class="f">يبدأ (اختياري)<input id="o-a" type="date"></label><label class="f">ينتهي (اختياري)<input id="o-e" type="date"></label></div><button class="btn" id="o-go">إنشاء العرض</button></div>
 <div class="card"><h3>العروض</h3>${OF.length?OF.map(o=>`<div class="of"><div class="pc2">-${esc(o.pct)}%</div><div class="inf"><b>${esc(o.title)}</b><small>${o.scope==='all'?'كل المنتجات':o.scope==='cat'?'قسم '+esc(o.target):'قطعة '+esc(o.target)} ${o.starts?'· من '+esc(o.starts):''} ${o.ends?'· لحد '+esc(o.ends):''}</small></div><label class="sw"><input type="checkbox" data-oa="${esc(o.id)}" ${o.active?'checked':''}> شغال</label><button class="btn d s" data-od="${esc(o.id)}">حذف</button></div>`).join(''):'<div class="empty">مفيش عروض.</div>'}<p class="muted">الخصم بيتحسب لوحده في المتجر والسلة، وبيظهر السعر القديم متشطب. لو القطعة ليها سعر بعد خصم يدوي أو أكتر من عرض، بيتطبق الأقل سعرا.</p></div>`;
 $('#o-s').onchange=tg;tg();
 $('#o-go').onclick=async()=>{const sc=$('#o-s').value,t=$('#o-t').value,pc=Math.floor(+$('#o-p').value),n=$('#o-n').value.trim();if(!n)return toast('اكتب اسم العرض');if(!(pc>=1&&pc<=90))return toast('النسبة من 1 لـ 90');if(sc!=='all'&&!t)return toast('اختار القسم أو القطعة');
  const id='o'+Date.now();try{await setDoc(doc(db,'offers',id),{data:JSON.stringify({title:n,pct:pc,scope:sc,target:sc==='all'?'':t,starts:$('#o-a').value,ends:$('#o-e').value,active:true})});await loadO();toast('اتعمل العرض ✅');render()}catch(e){toast('فشل: '+e.code)}};
 $$('[data-oa]').forEach(c=>c.onchange=async()=>{const o=OF.find(x=>x.id===c.dataset.oa);const {id,...r}=o;r.active=c.checked;try{await setDoc(doc(db,'offers',o.id),{data:JSON.stringify(r)});o.active=c.checked;toast(c.checked?'العرض اشتغل':'العرض وقف')}catch(e){toast('فشل: '+e.code)}});
 $$('[data-od]').forEach(b=>b.onclick=async()=>{if(!confirm('تحذف العرض؟'))return;try{await deleteDoc(doc(db,'offers',b.dataset.od));await loadO();render()}catch(e){toast('فشل: '+e.code)}})}
/* preview */
let pvu='index.html',pvm=false;
function rPv(){$('#v-pv').innerHTML=`<div class="row" style="margin-bottom:12px"><button class="btn s ${pvm?'g':''}" id="p-d">كمبيوتر</button><button class="btn s ${pvm?'':'g'}" id="p-m">موبايل</button><select id="p-s"><option value="index.html">الصفحة الرئيسية</option><option value="checkout.html">إتمام الطلب</option>${Object.values(PR).map(p=>`<option value="product.html?c=${encodeURIComponent(p.code)}">${esc(p.code)} · ${esc(p.name)}</option>`).join('')}</select><a class="btn g s" target="_blank" id="p-o" href="${esc(pvu)}">افتح في تبويب جديد</a></div><div class="pv ${pvm?'pvw':''}"><iframe id="p-i" src="${esc(pvu)}"></iframe></div><p class="muted">ده المتجر الحقيقي زي ما العميل بيشوفه. زياراتك مش بتتحسب في الإحصائيات طول ما خيار الاستبعاد شغال.</p>`;
 $('#p-s').value=pvu;$('#p-s').onchange=e=>{pvu=e.target.value;rPv()};$('#p-d').onclick=()=>{pvm=false;rPv()};$('#p-m').onclick=()=>{pvm=true;rPv()}}
</script></body></html>
