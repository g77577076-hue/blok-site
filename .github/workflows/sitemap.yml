name: sitemap
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: pip install pillow
      - name: Generate product pages and sitemap from the live catalog
        run: python3 gen_seo.py
      - name: Commit if changed
        run: |
          git add sitemap.xml BLOK-*.html *-og.jpg
          if ! git diff --cached --quiet; then
            git config user.name "sitemap-bot"
            git config user.email "sitemap-bot@users.noreply.github.com"
            git commit -m "Update product pages and sitemap from live catalog"
            git push
          fi
