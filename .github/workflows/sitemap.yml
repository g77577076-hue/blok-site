name: sitemap
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate sitemap from the live catalog
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.request, datetime
          SITE = 'https://g77577076-hue.github.io/blok-site/'
          FS = 'https://firestore.googleapis.com/v1/projects/blok-store/databases/(default)/documents/products?pageSize=100'
          docs = json.load(urllib.request.urlopen(FS, timeout=30)).get('documents', [])
          today = datetime.date.today().isoformat()
          urls = [(SITE, '1.0')]
          for d in docs:
              f = d.get('fields', {})
              if (f.get('active') or {}).get('booleanValue') is False:
                  continue
              code = (f.get('code') or {}).get('stringValue') or d['name'].split('/')[-1]
              if not code:
                  continue
              page = code + '.html'
              urls.append((SITE + page if os.path.exists(page) else SITE + 'product.html?c=' + code, '0.8'))
          if len(urls) < 2:
              raise SystemExit('no products found, keeping old sitemap')
          out = '<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'
          for u, p in sorted(urls, key=lambda x: (x[1] != '1.0', x[0])):
              out += '<url><loc>%s</loc><lastmod>%s</lastmod><changefreq>weekly</changefreq><priority>%s</priority></url>' % (u.replace('&', '&amp;'), today, p)
          out += '</urlset>\n'
          old = open('sitemap.xml', encoding='utf-8').read() if os.path.exists('sitemap.xml') else ''
          strip = lambda s: __import__('re').sub(r'<lastmod>[^<]*</lastmod>', '', s)
          if strip(old) != strip(out):
              open('sitemap.xml', 'w', encoding='utf-8').write(out)
              print('sitemap updated')
          else:
              print('sitemap unchanged')
          PYEOF
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain sitemap.xml)" ]; then
            git config user.name "sitemap-bot"
            git config user.email "sitemap-bot@users.noreply.github.com"
            git add sitemap.xml
            git commit -m "Update sitemap from live catalog"
            git push
          fi
